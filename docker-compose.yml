services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"

  api:
    build:
      context: .
      dockerfile: src/GtMotive.Estimate.Microservice.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://mongo:27017
    ports:
      - "8080:8080"
    depends_on:
      - mongo
